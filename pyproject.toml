[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisplan"
version = "0.1.0"
description = "Neuro-Symbolic Healthcare Spatial Synthesis Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.10.0",
    "pydantic>=2.7.0",
    "shapely>=2.0.0",
    "networkx>=3.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
